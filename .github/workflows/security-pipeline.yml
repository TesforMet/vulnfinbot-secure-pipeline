name: Security CI Pipeline

on:
  push:
    branches: ["main", "test-vulnerability"]
  pull_request:
    branches: ["main"]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Run Unit Tests & AI Security Tests
        run: pytest -v

      - name: Run SAST - Bandit
        continue-on-error: true
        run: |
          bandit -r app/ -f json -o reports/bandit-report.json
          bandit -r app/

      - name: Run SAST - Semgrep
        continue-on-error: true
        run: |
          semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json app/
          semgrep scan --config security/semgrep/rules.yml --error app/

      - name: Run Dependency Scan - pip-audit
        continue-on-error: true
        run: |
          pip-audit -f json -o reports/dependency-report.json
          pip-audit

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Run Container Scan - Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "vulnfinbot:latest"
          format: "json"
          output: "reports/trivy-report.json"

      - name: Start container for DAST
        run: |
          docker run -d --name vulnfinbot-dast -p 5000:5000 vulnfinbot:latest
          sleep 5
          curl -f http://localhost:5000/health

      - name: Run DAST - OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -J zap-report.json

      - name: Stop DAST container
        if: always()
        run: docker rm -f vulnfinbot-dast || true

      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn